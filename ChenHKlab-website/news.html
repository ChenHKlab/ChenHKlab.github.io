<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>chenlabHK</title>
    <link rel="stylesheet" href="./main.css">
    <style>
      
      
      .content-container{
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
        
      }

      
      /* 页面标题 */
       .page-title {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        margin: 70px 0 80px;
        color: #000000;
        display: flex;
        justify-content: center;
      }
      
      
      /* 普通新闻项样式 */
      .news-item {
        display: flex;
        align-items: flex-start; 
        margin-bottom: 30px; 
        font-size: 20px;
        width: 100%; 
        padding: 0 20px;
      }

      .news-date {
        flex: 0 0 120px; 
        display: flex;
        align-items: center; 
        font-size: 23px;
        font-weight: bold;
        white-space: nowrap; 
      }

      .news-date .bullet {
        font-size: 25px;
        margin-right: 10px;
      }

      .news-content {
        flex: 1; 
        text-align: left; 
        padding-left: 20px; 
      }

      /* 特殊布局 - 第一条和最后一条消息 */
      .special-news-item {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        margin-bottom: 30px;
        font-size: 20px;
        width: 100%;
        padding: 0 20px;
        gap: 20px;
      }
      
      .special-news-text {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      
      .special-news-images {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        max-width: 600px;
      }
      
      /* 图片容器样式 */
      .image-container{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto 40px;
        padding: 0 20px;
        align-items: stretch;
      }

      .image-wrapper{
        position: relative;
        width: 100%;
        height: 240px;
        overflow: hidden;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: transparent;
      }

      .image-wrapper img{
        width: auto;
        height: 240px;
        object-fit: contain;
        object-position: center;
        display: block;
        transition: transform 0.3s ease;
      }

      .image-wrapper:hover img{
        transform: scale(1.03);
      }
      
      
    </style>
  </head>

  <body>

    <!--Header image part-->
    <div class='header'>
      <img class='headerimg' src='./img/香港理工大学.jpg'>
    </div>

    <!--Navigation bar part---->
    <nav>
        <ul>
          <li><a href='index.html'>AboutUs</a></li>
          <li><a class='active' href='./news.html'>News</a></li>
          <li><a href='./research.html'>Research</a></li>
          <li><a href='./people.html'>People</a></li>
          <li><a href='./publications.html'>Publications</a></li>
          <li><a href='joinus.html'>JoinUs</a></li>
          <li><a href='./gallery.html'>Gallery</a></li>
        </ul>
       
      </nav>



   <div class="content-container">
  <h1 class="page-title">Lab Updates</h1>

  <!-- 第一条新闻 -->
  <div class="special-news-item">
    <div class="special-news-text">
      <div class="news-date">
        <span class="bullet">•</span>6/2026
      </div>

      <div class="news-content">
        Zhaoqian Yue and Guang Yang presented their work at
        The Chinese University of Hong Kong. Congratulations to them!
      </div>
    </div>

    <div class="special-news-images">
      <div class="image-wrapper">
        <img src="./img/news/2606 岳朝倩.jpg"
             alt="Zhaoqian Yue presenting her work">
      </div>
      <div class="image-wrapper">
        <img src="./img/news/2606 阳光.jpg"
             alt="Guang Yang presenting his work">
      </div>
    </div>
  </div>

  <!-- 第二条新闻 -->
  <div class="special-news-item">
    <div class="special-news-text">
      <div class="news-date">
        <span class="bullet">•</span>5/2026
      </div>

      <div class="news-content">
        Professor Chen designed a logo for the research group.
      </div>
    </div>

    <div class="special-news-images">
      <div class="image-wrapper">
        <img src="./img/news/组徽.jpg" alt="Chen Lab logo">
      </div>
    </div>
  </div>
</div>

</body>
</html>
